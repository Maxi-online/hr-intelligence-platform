# Public configuration example. Provider accounts and tokens are supplied separately.
ai_analysis:
  openai_api_key: ${OPENAI_API_KEY}
  model: gpt-5-nano
  max_completion_tokens: 16000
  retry_attempts: 3
  multi_agent:
    enabled: true
    parallel_processing: true
    agents:
    - technical_skills
    - experience_relevance
    - cultural_fit
    - growth_potential
    - resume_analysis
    - anomaly_detection
    master_coordinator:
      enabled: true
      model: gpt-5-nano
      max_completion_tokens: 16000
  proxy:
    enabled: false
    host: ''
    port: 0
    username: ''
    password: ''
    protocol: http
cache:
  enabled: true
  max_size: 1000
  ttl: 3600
clickhouse:
  connection:
    compression: true
    secure: false
  database: hrhelp
  host: clickhouse
  http_port: 8123
  password: ${CLICKHOUSE_PASSWORD}
  pool:
    max_connections: 20
    max_lifetime: 3600
    min_connections: 2
  port: 9000
  settings:
    compress: true
    max_memory_usage: '10000000000'
    max_threads: '8'
  username: ${CLICKHOUSE_USERNAME}
database:
  cache_ttl: 3600
  max_cache_size: 10000
  mongodb:
    collection: candidates
    database: hrhelp
    uri: mongodb://localhost:27017
  postgresql:
    database: hrhelp
    host: localhost
    password: ''
    port: 5432
    username: ${CLICKHOUSE_USERNAME}
  sqlite:
    path: data/candidates.db
  type: clickhouse
hh_api:
  base_url: https://api.hh.ru
  client_id: ${HH_API_CLIENT_ID}
  client_secret: ${HH_API_CLIENT_SECRET}
  max_retries: 3
  user_agent: ${HH_API_USER_AGENT}
  user_tokens:
    access_token: ${HH_API_USER_TOKENS_ACCESS_TOKEN}
    expires_at: 0
    refresh_token: ${HH_API_USER_TOKENS_REFRESH_TOKEN}
logging:
  file: logs/app.log
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  level: INFO
monitoring:
  health_check_interval: 30
  metrics_enabled: true
  prometheus_enabled: false
ranking:
  max_candidates: 100
  min_score: 0.1
  weights:
    filter_match: 0.3
    keyword_relevance: 0.4
    profile_completeness: 0.1
    recency: 0.2
search:
  default_filters:
    max_age: 65
    min_age: 18
    period: 30
  default_per_page: 20
  max_pages: 5
  max_results: 100
security:
  api_key_required: false
  cors_origins:
  - http://localhost:8501
  - http://127.0.0.1:8501
  rate_limit: 100
services:
  ai_analysis:
    debug: false
    docker_host: ai_analysis
    host: ${SERVICES_AI_ANALYSIS_HOST}
    port: 8005
  config:
    debug: false
    docker_host: config
    host: ${SERVICES_AI_ANALYSIS_HOST}
    port: 8004
  database:
    debug: false
    docker_host: database
    host: ${SERVICES_AI_ANALYSIS_HOST}
    port: 8006
  frontend:
    debug: false
    docker_host: frontend
    host: ${SERVICES_AI_ANALYSIS_HOST}
    port: 8501
  gateway:
    debug: false
    docker_host: gateway
    host: ${SERVICES_AI_ANALYSIS_HOST}
    port: 8088
  hh_api:
    debug: false
    docker_host: hh_api
    host: ${SERVICES_AI_ANALYSIS_HOST}
    port: 8003
  ranking:
    debug: false
    docker_host: ranking
    host: ${SERVICES_AI_ANALYSIS_HOST}
    port: 8002
  search:
    debug: false
    docker_host: search
    host: ${SERVICES_AI_ANALYSIS_HOST}
    port: 8001
