# Demonstration only. All actions are inactive by default.
rules:
- rule_id: demo_manual_review
  name: Demonstration review rule
  condition:
    event: demo_request
  action:
    type: notify
    recipients:
    - reviewer
  priority: 1
  active: false
  created_by: demonstration
  created_at: '2026-11-14T00:00:00Z'
global_settings:
  max_concurrent_rules: 1
  rule_timeout: 30
  retry_failed_actions: false
  log_all_actions: false
  priority_levels:
    1: low
