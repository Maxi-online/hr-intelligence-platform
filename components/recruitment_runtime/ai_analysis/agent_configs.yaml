# ================================
# КОНФИГУРАЦИИ МУЛЬТИ-АГЕНТНОЙ СИСТЕМЫ
# ================================

# Общие настройки системы
system_settings:
  max_parallel_agents: 7
  fallback_on_error: true
  log_level: "INFO"

# ================================
# КОНФИГУРАЦИИ АГЕНТОВ
# ================================

agents:
  requirements_agent:
    name: "Агент Анализа Требований"
    enabled: true
    priority: 1
    timeout: 15.0
    retry_count: 2
    
    # Веса критериев (сумма должна быть 1.0)
    criteria_weights:
      skills_match: 0.50
      experience_match: 0.30
      education_match: 0.10
      language_match: 0.10
    
    # Пороги для оценок
    scoring_thresholds:
      excellent: 90
      good: 75
      acceptable: 60
      poor: 40
    
    # Специфические настройки
    settings:
      strict_skill_matching: true
      experience_tolerance: 0.8  # 80% от требуемого опыта
      consider_related_skills: false
      education_importance: "medium"

  resume_analysis_agent:
    name: "Агент Анализа Резюме" 
    enabled: true
    priority: 2
    timeout: 20.0
    retry_count: 2
    
    criteria_weights:
      about_section_quality: 0.30
      information_coherence: 0.20
      professional_maturity: 0.30
      presentation_quality: 0.20
    
    scoring_thresholds:
      excellent: 85
      good: 70
      acceptable: 55
      poor: 35
    
    settings:
      min_about_length: 50
      max_about_length: 500
      check_metrics_presence: true
      flag_unprofessional_language: true
      analyze_contact_completeness: true

  technical_skills_agent:
    name: "Агент Технических Навыков"
    enabled: true
    priority: 3
    timeout: 25.0
    retry_count: 2
    
    criteria_weights:
      core_stack_match: 0.40
      expertise_depth: 0.25
      knowledge_breadth: 0.20
      technology_currency: 0.15
    
    scoring_thresholds:
      excellent: 88
      good: 75
      acceptable: 60
      poor: 40
    
    settings:
      # Категории технических навыков
      skill_categories:
        programming_languages:
          weight: 0.30
          examples: ["Python", "Java", "JavaScript", "C++", "C#", "Go", "Rust"]
        frameworks:
          weight: 0.25
          examples: ["Django", "Flask", "React", "Angular", "Vue", "Spring", "Express"]
        databases:
          weight: 0.20
          examples: ["PostgreSQL", "MySQL", "MongoDB", "Redis", "ClickHouse"]
        devops:
          weight: 0.15
          examples: ["Docker", "Kubernetes", "AWS", "CI/CD", "Jenkins"]
        tools:
          weight: 0.10
          examples: ["Git", "IDE", "Testing frameworks", "Monitoring"]
      
      # Уровни экспертизы
      expertise_levels:
        junior: 
          experience_years: [0, 2]
          expected_skills: 3
        middle:
          experience_years: [2, 5] 
          expected_skills: 5
        senior:
          experience_years: [5, 100]
          expected_skills: 8
      
      technology_recency_years: 3  # Технологии актуальны если использовались в последние 3 года

  skill_level_agent:
    name: "Агент Оценки Уровня Навыков"
    enabled: true
    priority: 3
    timeout: 20.0
    retry_count: 2
    
    criteria_weights:
      skill_experience_match: 0.40
      skill_depth: 0.35
      position_match: 0.15
      credibility: 0.10
    
    scoring_thresholds:
      excellent: 85
      good: 70
      acceptable: 55
      poor: 40
    
    settings:
      # Строгие стандарты по уровням опыта
      experience_standards:
        junior:
          min_years: 0
          max_years: 2
          max_skills: 8
          advanced_skills: 0
        middle:
          min_years: 2
          max_years: 5
          max_skills: 15
          advanced_skills: 3
        senior:
          min_years: 5
          max_years: 100
          max_skills: 25
          advanced_skills: 8
      
      # Ключевые слова для детекции уровня
      advanced_keywords: ["senior", "lead", "advanced", "expert", "architect", "principal"]
      leadership_keywords: ["управление", "лидерство", "руководство", "mentoring", "team lead", "scrum master"]
      architecture_keywords: ["архитектура", "проектирование", "design patterns", "system design"]
      
      # Продвинутые технологии (требуют проверки опыта)
      advanced_skills: ["blockchain", "quantum computing", "web3", "smart contracts"]
      # Современные enterprise технологии (норма для middle+)
      enterprise_skills: ["kubernetes", "microservices", "ai", "machine learning", "docker", "aws", "azure"]
      incompatible_groups:
        - ["python 2", "python 3"]
        - ["angular", "react", "vue"]
        - ["java", "c#", ".net"]
        - ["ios", "android", "flutter", "react native"]
      
      # Контекстные слова для подтверждения навыков
      skill_contexts: 
        - "разработал"
        - "создал"
        - "внедрил"
        - "оптимизировал"
        - "руководил"
        - "проектировал"
        - "анализировал"
        - "настроил"
        - "администрировал"
        - "автоматизировал"
        - "интегрировал"
        - "тестировал"

  experience_agent:
    name: "Агент Профессионального Опыта"
    enabled: true
    priority: 4
    timeout: 20.0
    retry_count: 2
    
    criteria_weights:
      experience_relevance: 0.40
      career_progression: 0.25
      job_stability: 0.20
      achievements: 0.15
    
    scoring_thresholds:
      excellent: 87
      good: 73
      acceptable: 58
      poor: 38
    
    settings:
      # Анализ стабильности работы
      stability_analysis:
        min_job_duration_months: 12  # Минимальная длительность работы
        max_job_changes_per_year: 1.5  # Максимум смен работы в год
        gap_tolerance_months: 3  # Допустимые перерывы в карьере
      
      # Анализ карьерного роста
      progression_indicators:
        - "Повышение в должности"
        - "Увеличение ответственности"
        - "Рост команды в подчинении"
        - "Расширение функций"
        - "Переход в более крупную компанию"
      
      # Типы достижений
      achievement_categories:
        quantitative: ["Увеличил продажи на X%", "Сократил расходы на X%", "Управлял командой из X человек"]
        qualitative: ["Внедрил новый процесс", "Получил награду", "Успешно завершил проект"]

  formatting_agent:
    name: "Агент Качества Оформления"
    enabled: true
    priority: 5
    timeout: 15.0
    retry_count: 2
    
    criteria_weights:
      structure: 0.30
      completeness: 0.25
      readability: 0.25
      professionalism: 0.20
    
    scoring_thresholds:
      excellent: 90
      good: 75
      acceptable: 60
      poor: 40
    
    settings:
      # Обязательные разделы
      required_sections:
        - "title"       # Название позиции
        - "contacts"    # Контактная информация  
        - "about"       # О себе
        - "skills"      # Навыки
        - "experience"  # Опыт работы
      
      # Желательные разделы
      optional_sections:
        - "education"   # Образование
        - "languages"   # Языки
        - "certificates" # Сертификаты
        - "projects"    # Проекты
      
      # Проверки качества
      quality_checks:
        min_contact_fields: 2  # Email + телефон минимум
        min_about_words: 10
        max_about_words: 100
        check_spelling: false  # Пока отключено
        check_formatting_consistency: true

  anomaly_detection_agent:
    name: "Агент Детекции Аномалий"
    enabled: true
    priority: 6
    timeout: 20.0
    retry_count: 2
    
    criteria_weights:
      temporal_inconsistencies: 0.25
      logical_contradictions: 0.30
      suspicious_data: 0.25
      qualitative_mismatches: 0.20
    
    scoring_thresholds:
      excellent: 95  # Низкий риск аномалий
      good: 85
      acceptable: 70
      poor: 50       # Высокий риск аномалий
    
    settings:
      # Проверки временных нестыковок
      temporal_checks:
        max_career_gap_months: 6
        min_job_duration_months: 3
        max_overlapping_jobs: 0
        check_education_timeline: true
      
      # Логические проверки
      logic_checks:
        skill_experience_consistency: true
        position_progression_logic: true
        salary_progression_logic: false  # Данные о зарплате часто недоступны
        company_size_progression: true
      
      # Пороги подозрительности
      suspicion_thresholds:
        max_promotions_per_year: 2
        min_experience_for_senior: 4  # лет
        max_skills_for_junior: 15
        min_education_years: 4

# ================================
# КОНФИГУРАЦИИ ПО ТИПАМ ПОЗИЦИЙ
# ================================

position_configs:
  technical:
    primary_agents: 
      - "requirements_agent"
      - "technical_skills_agent"
      - "skill_level_agent"
      - "experience_agent"
      - "resume_analysis_agent"
    
    secondary_agents:
      - "formatting_agent"
      - "anomaly_detection_agent"
    
    # Веса агентов при расчете итоговой оценки
    agent_weights:
      requirements_agent: 0.20
      technical_skills_agent: 0.25
      skill_level_agent: 0.20
      experience_agent: 0.15
      resume_analysis_agent: 0.12
      formatting_agent: 0.04
      anomaly_detection_agent: 0.04

  management:
    primary_agents:
      - "requirements_agent"
      - "skill_level_agent"
      - "experience_agent" 
      - "resume_analysis_agent"
    
    secondary_agents:
      - "formatting_agent"
      - "anomaly_detection_agent"
    
    agent_weights:
      requirements_agent: 0.25
      skill_level_agent: 0.20
      experience_agent: 0.30
      resume_analysis_agent: 0.15
      formatting_agent: 0.05
      anomaly_detection_agent: 0.05

  sales:
    primary_agents:
      - "requirements_agent"
      - "skill_level_agent"
      - "experience_agent"
      - "resume_analysis_agent"
    
    secondary_agents:
      - "formatting_agent"
      - "anomaly_detection_agent"
    
    agent_weights:
      requirements_agent: 0.30
      skill_level_agent: 0.15
      experience_agent: 0.30
      resume_analysis_agent: 0.15
      formatting_agent: 0.05
      anomaly_detection_agent: 0.05

  general:
    primary_agents:
      - "requirements_agent"
      - "skill_level_agent"
      - "experience_agent"
      - "resume_analysis_agent"
    
    secondary_agents:
      - "formatting_agent"
      - "anomaly_detection_agent"
    
    agent_weights:
      requirements_agent: 0.30
      skill_level_agent: 0.20
      experience_agent: 0.25
      resume_analysis_agent: 0.15
      formatting_agent: 0.05
      anomaly_detection_agent: 0.05

# ================================
# МАСТЕР-КООРДИНАТОР НАСТРОЙКИ
# ================================

master_coordinator:
  scoring_method: "arithmetic_mean"  # arithmetic_mean | weighted_average
  
  # Настройки GPT для мастер-координатора (переопределяют common_settings)
  gpt_settings:
    model: "gpt-5-mini"
    max_completion_tokens: 2500  # GPT-5 параметр для мастер-координатора
    temperature: 0.3
    # GPT-5 расширенные возможности
    verbosity: "high"
    reasoning_effort: "medium"
    # Context-Free Grammar для строгого форматирования JSON
    response_format: 
      type: "json_object"
      schema: null  # Можно задать JSON Schema для валидации
  
  # Пороги для рекомендаций
  recommendation_thresholds:
    highly_recommended: 85
    recommended: 70
    consider_with_caution: 55
    requires_additional_review: 40
    not_recommended: 0
  
  # Настройки отчетов
  report_settings:
    max_red_flags_display: 5
    max_positive_points_display: 5
    max_recommendations_display: 3
    include_agent_details: true
    include_processing_times: true
  
  # Обработка ошибок агентов
  error_handling:
    exclude_failed_agents: true
    min_successful_agents: 2
    fallback_score: 50.0
    
# ================================
# ЛОГИРОВАНИЕ И МОНИТОРИНГ
# ================================

monitoring:
  log_agent_performance: true
  track_processing_times: true
  alert_on_agent_failures: true
  
  performance_thresholds:
    max_agent_time: 30.0
    max_total_time: 180.0
    min_success_rate: 0.95
  
  metrics_collection:
    enabled: true
    store_individual_scores: true
    store_processing_times: true
    store_error_rates: true