# ================================
# CONFIGUREMENT OF THE MULTI-AGENCY SYSTEM
# ================================

# General system settings
system_settings:
  max_parallel_agents: 7
  fallback_on_error: true
  log_level: "INFO"

# ================================
# CONFIGURE OF AGENCIES
# ================================

agents:
  requirements_agent:
    name: "Demand Analysis Agent"
    enabled: true
    priority: 1
    timeout: 15.0
    retry_count: 2
    
    # Weight of criteria (total to be 1.0)
    criteria_weights:
      skills_match: 0.50
      experience_match: 0.30
      education_match: 0.10
      language_match: 0.10
    
    # Evaluation thresholds
    scoring_thresholds:
      excellent: 90
      good: 75
      acceptable: 60
      poor: 40
    
    # Specific Settings
    settings:
      strict_skill_matching: true
      experience_tolerance: 0.8  # 80 per cent of required experience
      consider_related_skills: false
      education_importance: "medium"

  resume_analysis_agent:
    name: "Agent of Analysis Summary" 
    enabled: true
    priority: 2
    timeout: 20.0
    retry_count: 2
    
    criteria_weights:
      about_section_quality: 0.30
      information_coherence: 0.20
      professional_maturity: 0.30
      presentation_quality: 0.20
    
    scoring_thresholds:
      excellent: 85
      good: 70
      acceptable: 55
      poor: 35
    
    settings:
      min_about_length: 50
      max_about_length: 500
      check_metrics_presence: true
      flag_unprofessional_language: true
      analyze_contact_completeness: true

  technical_skills_agent:
    name: "Agent in Technical Skills"
    enabled: true
    priority: 3
    timeout: 25.0
    retry_count: 2
    
    criteria_weights:
      core_stack_match: 0.40
      expertise_depth: 0.25
      knowledge_breadth: 0.20
      technology_currency: 0.15
    
    scoring_thresholds:
      excellent: 88
      good: 75
      acceptable: 60
      poor: 40
    
    settings:
      # Technical skills categories
      skill_categories:
        programming_languages:
          weight: 0.30
          examples: ["Python", "Java", "JavaScript", "C++", "C#", "Go", "Rust"]
        frameworks:
          weight: 0.25
          examples: ["Django", "Flask", "React", "Angular", "Vue", "Spring", "Express"]
        databases:
          weight: 0.20
          examples: ["PostgreSQL", "MySQL", "MongoDB", "Redis", "ClickHouse"]
        devops:
          weight: 0.15
          examples: ["Docker", "Kubernetes", "AWS", "CI/CD", "Jenkins"]
        tools:
          weight: 0.10
          examples: ["Git", "IDE", "Testing frameworks", "Monitoring"]
      
      # Level of expertise
      expertise_levels:
        junior: 
          experience_years: [0, 2]
          expected_skills: 3
        middle:
          experience_years: [2, 5] 
          expected_skills: 5
        senior:
          experience_years: [5, 100]
          expected_skills: 8
      
      technology_recency_years: 3  # Technologies relevant if used in the last 3 years

  skill_level_agent:
    name: "Agent of the Assessment of the Level of Skills"
    enabled: true
    priority: 3
    timeout: 20.0
    retry_count: 2
    
    criteria_weights:
      skill_experience_match: 0.40
      skill_depth: 0.35
      position_match: 0.15
      credibility: 0.10
    
    scoring_thresholds:
      excellent: 85
      good: 70
      acceptable: 55
      poor: 40
    
    settings:
      # Strict standards by level of experience
      experience_standards:
        junior:
          min_years: 0
          max_years: 2
          max_skills: 8
          advanced_skills: 0
        middle:
          min_years: 2
          max_years: 5
          max_skills: 15
          advanced_skills: 3
        senior:
          min_years: 5
          max_years: 100
          max_skills: 25
          advanced_skills: 8
      
      # Keywords for Level Detective
      advanced_keywords: ["senior", "lead", "advanced", "expert", "architect", "principal"]
      leadership_keywords: ["management", "leadership", "management", "mentoring", "team lead", "scrum master"]
      architecture_keywords: ["architecture", "design", "design patterns", "system design"]
      
      # Advanced technologies (need to be tested)
      advanced_skills: ["blockchain", "quantum computing", "web3", "smart contracts"]
      # Modern intraprise technology (normal for muddle+)
      enterprise_skills: ["kubernetes", "microservices", "ai", "machine learning", "docker", "aws", "azure"]
      incompatible_groups:
        - ["python 2", "python 3"]
        - ["angular", "react", "vue"]
        - ["java", "c#", ".net"]
        - ["ios", "android", "flutter", "react native"]
      
      # Context words to demonstrate skills
      skill_contexts: 
        - "I've developed"
        - "He created it."
        - "implemented"
        - "Optimized"
        - "Director"
        - "Designed"
        - "I did."
        - "I set it up."
        - "Administered"
        - "Automation"
        - "integrated"
        - "Tested"

  experience_agent:
    name: "Agent of Professional Experience"
    enabled: true
    priority: 4
    timeout: 20.0
    retry_count: 2
    
    criteria_weights:
      experience_relevance: 0.40
      career_progression: 0.25
      job_stability: 0.20
      achievements: 0.15
    
    scoring_thresholds:
      excellent: 87
      good: 73
      acceptable: 58
      poor: 38
    
    settings:
      # Work stability analysis
      stability_analysis:
        min_job_duration_months: 12  # Minimum duration of work
        max_job_changes_per_year: 1.5  # Maximum change of work per year
        gap_tolerance_months: 3  # Allowable career breaks
      
      # Career analysis
      progression_indicators:
        - "Promotion"
        - "Increased responsibility"
        - "Team growth in command control"
        - "Extension of functions"
        - "Transition to a larger company"
      
      # Types of achievements
      achievement_categories:
        quantitative: ["Increased sales by X%", "Reduced expenditure by X%", "Managed a team of X men."]
        qualitative: ["I've introduced a new process.", "I got a reward.", "Successful completion of project"]

  formatting_agent:
    name: "Agent of Quality of Formation"
    enabled: true
    priority: 5
    timeout: 15.0
    retry_count: 2
    
    criteria_weights:
      structure: 0.30
      completeness: 0.25
      readability: 0.25
      professionalism: 0.20
    
    scoring_thresholds:
      excellent: 90
      good: 75
      acceptable: 60
      poor: 40
    
    settings:
      # Mandatory sections
      required_sections:
        - "title"       # Item title
        - "contacts"    # Contact information  
        - "about"       # About yourself.
        - "skills"      # Skills
        - "experience"  # Experience
      
      # Desirable sections
      optional_sections:
        - "education"   # Education
        - "languages"   # Languages
        - "certificates" # Certificates
        - "projects"    # Projects
      
      # Quality checks
      quality_checks:
        min_contact_fields: 2  # Email + telephone minimum
        min_about_words: 10
        max_about_words: 100
        check_spelling: false  # It's been turned off for now.
        check_formatting_consistency: true

  anomaly_detection_agent:
    name: "Agent Anomaly Detective."
    enabled: true
    priority: 6
    timeout: 20.0
    retry_count: 2
    
    criteria_weights:
      temporal_inconsistencies: 0.25
      logical_contradictions: 0.30
      suspicious_data: 0.25
      qualitative_mismatches: 0.20
    
    scoring_thresholds:
      excellent: 95  # Low risk of anomalies
      good: 85
      acceptable: 70
      poor: 50       # High risk of anomalies
    
    settings:
      # Checks of time inconsistencies
      temporal_checks:
        max_career_gap_months: 6
        min_job_duration_months: 3
        max_overlapping_jobs: 0
        check_education_timeline: true
      
      # Logical checks
      logic_checks:
        skill_experience_consistency: true
        position_progression_logic: true
        salary_progression_logic: false  # Wage data are often not available
        company_size_progression: true
      
      # Thresholds of Suspicion
      suspicion_thresholds:
        max_promotions_per_year: 2
        min_experience_for_senior: 4  # years
        max_skills_for_junior: 15
        min_education_years: 4

# ================================
# CONFIGURES ON THE TYPE OF POLICES
# ================================

position_configs:
  technical:
    primary_agents: 
      - "requirements_agent"
      - "technical_skills_agent"
      - "skill_level_agent"
      - "experience_agent"
      - "resume_analysis_agent"
    
    secondary_agents:
      - "formatting_agent"
      - "anomaly_detection_agent"
    
    # Weights of agents in the calculation of the final estimate
    agent_weights:
      requirements_agent: 0.20
      technical_skills_agent: 0.25
      skill_level_agent: 0.20
      experience_agent: 0.15
      resume_analysis_agent: 0.12
      formatting_agent: 0.04
      anomaly_detection_agent: 0.04

  management:
    primary_agents:
      - "requirements_agent"
      - "skill_level_agent"
      - "experience_agent" 
      - "resume_analysis_agent"
    
    secondary_agents:
      - "formatting_agent"
      - "anomaly_detection_agent"
    
    agent_weights:
      requirements_agent: 0.25
      skill_level_agent: 0.20
      experience_agent: 0.30
      resume_analysis_agent: 0.15
      formatting_agent: 0.05
      anomaly_detection_agent: 0.05

  sales:
    primary_agents:
      - "requirements_agent"
      - "skill_level_agent"
      - "experience_agent"
      - "resume_analysis_agent"
    
    secondary_agents:
      - "formatting_agent"
      - "anomaly_detection_agent"
    
    agent_weights:
      requirements_agent: 0.30
      skill_level_agent: 0.15
      experience_agent: 0.30
      resume_analysis_agent: 0.15
      formatting_agent: 0.05
      anomaly_detection_agent: 0.05

  general:
    primary_agents:
      - "requirements_agent"
      - "skill_level_agent"
      - "experience_agent"
      - "resume_analysis_agent"
    
    secondary_agents:
      - "formatting_agent"
      - "anomaly_detection_agent"
    
    agent_weights:
      requirements_agent: 0.30
      skill_level_agent: 0.20
      experience_agent: 0.25
      resume_analysis_agent: 0.15
      formatting_agent: 0.05
      anomaly_detection_agent: 0.05

# ================================
# TYPE MATER-COORDINATION
# ================================

master_coordinator:
  scoring_method: "arithmetic_mean"  # arithmetic_mean | weighted_average
  
  # GPT settings for Master Coordinator (redefined common_settings))
  gpt_settings:
    model: "gpt-5-mini"
    max_completion_tokens: 2500  # GPT-5 parameter for Master Coordinator
    temperature: 0.3
    # GPT-5 Enhanced Opportunities
    verbosity: "high"
    reasoning_effort: "medium"
    # Context-Free Grammar for the strict formatting of JSON
    response_format: 
      type: "json_object"
      schema: null  # You can ask JSON Schema for validation.
  
  # Criteria for recommendations
  recommendation_thresholds:
    highly_recommended: 85
    recommended: 70
    consider_with_caution: 55
    requires_additional_review: 40
    not_recommended: 0
  
  # Reporting settings
  report_settings:
    max_red_flags_display: 5
    max_positive_points_display: 5
    max_recommendations_display: 3
    include_agent_details: true
    include_processing_times: true
  
  # Errors of agents
  error_handling:
    exclude_failed_agents: true
    min_successful_agents: 2
    fallback_score: 50.0
    
# ================================
# LOIGRATION AND MONITORING
# ================================

monitoring:
  log_agent_performance: true
  track_processing_times: true
  alert_on_agent_failures: true
  
  performance_thresholds:
    max_agent_time: 30.0
    max_total_time: 180.0
    min_success_rate: 0.95
  
  metrics_collection:
    enabled: true
    store_individual_scores: true
    store_processing_times: true
    store_error_rates: true